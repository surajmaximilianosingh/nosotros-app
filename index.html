<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1730">
<title>Nosotros</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosotros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0B1730;
    --surface:#122446;
    --surface-2:#17305A;
    --line:#274070;
    --text:#F3F6FC;
    --text-dim:#93A6CC;
    --a:#F5A623;     /* persona A · dorado */
    --a-dim:#3D2E13;
    --b:#3FA6F2;     /* persona B · celeste */
    --b-dim:#123049;
    --shared:#29C2D6; /* compartido · turquesa */
    --shared-dim:#0F3A42;
    --danger:#E2685A;
    --danger-dim:#3A2420;
    --gold:#F5A623;
    --peach:#FFC773;
    --cyan:#4FD3E8;
    --blue:#2F7FE0;
    --navy:#0B1730;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -8%, rgba(245,166,35,.14), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(63,166,242,.16), transparent 38%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:78px;
  }
  /* ---------- header ---------- */
  header{
    padding:20px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header .brand{font-size:20px;font-weight:600;letter-spacing:-0.02em;}
  header .brand span{color:var(--shared);}
  .who-pill{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .who-pill button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .who-pill button.active-a{background:var(--a-dim);color:var(--a);}
  .who-pill button.active-b{background:var(--b-dim);color:var(--b);}

  main{flex:1;padding:0 20px 20px;}
  .section-title{font-size:18px;font-weight:600;margin:4px 0 14px;letter-spacing:-0.01em;}
  .muted{color:var(--text-dim);}
  .small{font-size:13px;}

  /* ---------- cards / rows ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}

  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .metric{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .metric .label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .metric .value{font-size:22px;font-weight:600;}

  .bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--shared);}
  .bar-fill.over{background:var(--danger);}

  .list-item{
    border-bottom:1px solid var(--line);
    padding:12px 0;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .list-item:last-child{border-bottom:none;}
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .tag.a{background:var(--a-dim);color:var(--a);}
  .tag.b{background:var(--b-dim);color:var(--b);}
  .tag.shared{background:var(--shared-dim);color:var(--shared);}

  .checkbox{
    width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
    background:var(--surface-2);
  }
  .checkbox.checked{background:var(--shared);border-color:var(--shared);}
  .checkbox svg{width:14px;height:14px;display:none;}
  .checkbox.checked svg{display:block;}

  .item-title{font-size:15px;font-weight:500;}
  .item-title.done{text-decoration:line-through;color:var(--text-dim);}
  .item-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

  .empty{
    text-align:center;
    padding:36px 12px;
    color:var(--text-dim);
  }
  .empty .big{font-size:15px;color:var(--text);margin-bottom:4px;font-weight:500;}

  /* ---------- inputs ---------- */
  input,select,textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
  }
  input::placeholder,textarea::placeholder{color:var(--text-dim);}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-dim);}
  .owner-choice{display:flex;gap:8px;}
  .owner-choice button{
    flex:1;
    padding:10px 6px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .owner-choice button.sel-a{background:var(--a-dim);color:var(--a);border-color:var(--a);}
  .owner-choice button.sel-b{background:var(--b-dim);color:var(--b);border-color:var(--b);}
  .owner-choice button.sel-shared{background:var(--shared-dim);color:var(--shared);border-color:var(--shared);}

  button.primary{
    width:100%;
    background:var(--shared);
    color:#0E241C;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
  }
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:10px;
    padding:10px 14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .fab{
    position:fixed;
    bottom:92px;
    right:calc(50% - 240px + 20px);
    width:56px;height:56px;
    border-radius:50%;
    background:var(--shared);
    color:#0E241C;
    border:none;
    font-size:26px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:520px){
    .fab{right:20px;}
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg);
    border:1px solid var(--line);
    border-top-left-radius:20px;border-top-right-radius:20px;
    width:100%;max-width:480px;
    padding:22px 20px 28px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 16px;font-size:17px;}
  .sheet .stack{gap:14px;}

  /* ---------- bottom nav ---------- */
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:480px;
    margin:0 auto;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:40;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    padding:6px 2px;
    cursor:pointer;
  }
  nav.tabbar button.active{color:var(--shared);}
  nav.tabbar svg{width:21px;height:21px;}

  .setup-wrap{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    padding:40px 30px;max-width:480px;margin:0 auto;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 18% 8%, rgba(255,199,115,.9), transparent 42%),
      radial-gradient(circle at 88% 0%, rgba(79,211,232,.55), transparent 40%),
      linear-gradient(165deg, #F5A623 0%, #E08A3E 22%, #2F7FE0 62%, #0B1730 100%);
  }
  .setup-wrap .stack, .setup-wrap label{ position:relative; z-index:2; width:100%; }
  .setup-wrap h1{font-size:26px;line-height:1.25;margin:18px 0 6px;color:#fff;position:relative;z-index:2;}
  .setup-wrap p{color:rgba(255,255,255,.88);margin:0 0 28px;font-size:14.5px;position:relative;z-index:2;}
  .brand-mark{width:84px;height:84px;border-radius:22px;position:relative;z-index:2;box-shadow:0 12px 30px rgba(0,0,0,.35);}
  .tagline{color:rgba(255,255,255,.75);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:-18px 0 26px;position:relative;z-index:2;}
  .setup-wave{position:absolute;bottom:-2px;left:0;width:100%;z-index:1;opacity:.9;}
  .setup-wrap input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;}
  .setup-wrap input::placeholder{color:rgba(255,255,255,.6);}
  .setup-wrap .owner-choice button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.85);}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="root"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ FIREBASE CONFIG ============ */
/* PASO 1: Reemplazá este objeto por el que te da tu propio proyecto de Firebase.
   Sacalo de: Configuración del proyecto > Tus apps > SDK setup and configuration.
   Es información pública (no una contraseña), no pasa nada si queda visible. */
const firebaseConfig = {
  apiKey: "AIzaSyAwS4IeE1FTz2FeiWwSlTxE6I4iRnYoEQE",
  authDomain: "nostros-app.firebaseapp.com",
  projectId: "nostros-app",
  storageBucket: "nostros-app.firebasestorage.app",
  messagingSenderId: "273424691354",
  appId: "1:273424691354:web:56e1ccdc2e2011057d6f23"
};
/* PASO 2 (opcional pero recomendado): cambiá esto por una palabra secreta que
   solo ustedes dos conozcan. Actúa como el "nombre de la sala" de sus datos,
   para que nadie más que tenga el mismo Firebase la pise. */
const ROOM_ID = "nuestra-sala";

let db = null;
let fbReady = false;
try{
  if(firebaseConfig.apiKey !== "PEGA_ACA_TU_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }
}catch(e){ console.error('firebase init error', e); }

function docRef(){ return db.collection('nosotros-app').doc(ROOM_ID); }

/* ============ storage helpers (Firestore) ============ */
async function sget(key){
  try{
    const snap = await docRef().get();
    const data = snap.exists ? snap.data() : null;
    return data && data[key] !== undefined ? data[key] : null;
  }catch(e){ console.error('read error', e); return null; }
}
async function sset(key, val){
  try{ await docRef().set({[key]: val}, {merge:true}); }
  catch(e){ console.error('write error', e); showToast('No se pudo guardar. Revisá tu conexión.'); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ============ state ============ */
let state = {
  settings: null,          // {nameA, nameB}
  goals: [],
  plans: [],
  budget: {monthlyLimit:0, transactions:[]},
  savings: {goal:0, contributions:[]},
  shopping: [],
  dates: [],
  pet: {name:'Prisca', logs:[]},
  menu: {entries:[]}
};
let whoami = null;         // 'A' | 'B'
let tab = 'home';
let lastSnapshot = '';
const WHOAMI_KEY = 'nosotros_whoami';

async function loadAll(){
  const [settings, goals, plans, budget, savings, shopping, dates, pet, menu] = await Promise.all([
    sget('settings'), sget('goals'), sget('plans'), sget('budget'), sget('savings'), sget('shopping'), sget('dates'), sget('pet'), sget('menu')
  ]);
  state.settings = settings;
  state.goals = goals || [];
  state.plans = plans || [];
  state.budget = budget || {monthlyLimit:0, transactions:[]};
  state.savings = savings || {goal:0, contributions:[]};
  state.shopping = shopping || [];
  state.dates = dates || [];
  state.pet = pet || {name:'Prisca', logs:[]};
  state.menu = menu || {entries:[]};
}

function ownerName(owner){
  if(owner==='A') return state.settings?.nameA || 'Persona A';
  if(owner==='B') return state.settings?.nameB || 'Persona B';
  return 'Los dos';
}
function ownerTagClass(owner){
  return owner==='A' ? 'a' : owner==='B' ? 'b' : 'shared';
}

/* ============ render root ============ */
function render(){
  const root = document.getElementById('root');
  if(!state.settings){ root.innerHTML = setupScreen(); attachSetupEvents(); return; }
  if(!whoami){ root.innerHTML = whoScreen(); attachWhoEvents(); return; }

  root.innerHTML = `
    <div class="app">
      ${headerHtml()}
      <main>${tabContent()}</main>
      ${tabbarHtml()}
      ${fabHtml()}
    </div>
  `;
  attachChromeEvents();
  attachTabEvents();
}

/* ============ setup screen ============ */
function setupScreen(){
  return `
  <div class="setup-wrap">
    <img src="/icon-192.png" class="brand-mark" alt="" />
    <h1>Un espacio para los dos.</h1>
    <div class="tagline">Juntos, siempre</div>
    <p>Objetivos, plata y compras, sincronizado entre tus celulares. Para empezar, ¿cómo se llaman?</p>
    <div class="stack">
      <label class="field">Tu nombre
        <input id="nameA" placeholder="Ej: Juli" />
      </label>
      <label class="field">El nombre de tu pareja
        <input id="nameB" placeholder="Ej: Fran" />
      </label>
      <button class="primary" id="startBtn" style="margin-top:8px;">Crear nuestro espacio</button>
    </div>
    ${setupWaveSvg()}
  </div>`;
}
function setupWaveSvg(){
  return `<svg class="setup-wave" viewBox="0 0 500 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 40 C 80 10, 160 70, 250 40 C 340 10, 420 70, 500 40 L500 80 L0 80 Z" fill="rgba(11,23,48,0.55)"/>
    <path d="M0 55 C 90 25, 170 80, 260 55 C 350 30, 430 80, 500 55 L500 80 L0 80 Z" fill="rgba(11,23,48,0.85)"/>
  </svg>`;
}
function attachSetupEvents(){
  document.getElementById('startBtn').onclick = async ()=>{
    const a = document.getElementById('nameA').value.trim();
    const b = document.getElementById('nameB').value.trim();
    if(!a || !b){ showToast('Completá los dos nombres'); return; }
    state.settings = {nameA:a, nameB:b};
    await sset('settings', state.settings);
    render();
  };
}

/* ============ who am i screen ============ */
function whoScreen(){
  return `
  <div class="setup-wrap">
    <img src="/icon-192.png" class="brand-mark" alt="" />
    <h1>Hola de nuevo.</h1>
    <div class="tagline">Juntos, siempre</div>
    <p>¿Quién sos vos en este celular?</p>
    <div class="stack">
      <button class="owner-choice sel-a" id="pickA" style="padding:16px;font-size:15px;">${state.settings.nameA}</button>
      <button class="owner-choice sel-b" id="pickB" style="padding:16px;font-size:15px;">${state.settings.nameB}</button>
    </div>
    ${setupWaveSvg()}
  </div>`;
}
function attachWhoEvents(){
  document.getElementById('pickA').onclick = ()=>{ whoami='A'; localStorage.setItem(WHOAMI_KEY,'A'); render(); };
  document.getElementById('pickB').onclick = ()=>{ whoami='B'; localStorage.setItem(WHOAMI_KEY,'B'); render(); };
}

/* ============ header + tabbar + fab ============ */
function headerHtml(){
  return `
  <header>
    <div class="brand">${state.settings.nameA} <span>&</span> ${state.settings.nameB}</div>
    <div class="row" style="gap:8px;">
      <div class="who-pill">
        <button data-who="A" class="${whoami==='A'?'active-a':''}">${state.settings.nameA}</button>
        <button data-who="B" class="${whoami==='B'?'active-b':''}">${state.settings.nameB}</button>
      </div>
    </div>
  </header>`;
}
function attachChromeEvents(){
  document.querySelectorAll('[data-who]').forEach(b=>{
    b.onclick = ()=>{ whoami = b.dataset.who; localStorage.setItem(WHOAMI_KEY, whoami); render(); };
  });
}

const TABS = [
  {id:'home', label:'Inicio', icon:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>'},
  {id:'goals', label:'Objetivos', icon:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>'},
  {id:'plans', label:'Planes', icon:'<path d="M9 3h6l1 4H8z"/><path d="M12 7v5"/><path d="M8 21c0-4 1.8-6 4-6s4 2 4 6"/>'},
  {id:'pet', label:'Prisca', icon:'<circle cx="8" cy="7" r="1.6"/><circle cx="12.5" cy="5.5" r="1.6"/><circle cx="17" cy="7" r="1.6"/><circle cx="19" cy="11" r="1.6"/><path d="M12.5 12c-3 0-5.5 2.2-5.5 4.8 0 1.9 1.6 3.2 3.4 2.6.8-.3 1.4-.3 2.1 0 1.8.6 3.4-.7 3.4-2.6 0-2.6-2.4-4.8-5.4-4.8Z"/>'},
  {id:'budget', label:'Presupuesto', icon:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h.01"/>'},
  {id:'shopping', label:'Compras', icon:'<path d="M6 8h13l-1.5 9h-10z"/><path d="M6 8 5 4H3"/><circle cx="9.5" cy="20" r="1"/><circle cx="16.5" cy="20" r="1"/>'},
  {id:'dates', label:'Calendario', icon:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/>'}
];
function tabbarHtml(){
  return `<nav class="tabbar">
    ${TABS.map(t=>`
      <button data-tab="${t.id}" class="${tab===t.id?'active':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
        ${t.label}
      </button>`).join('')}
  </nav>`;
}
function fabHtml(){
  if(tab==='home' || tab==='pet') return '';
  if(tab==='shopping' && shoppingView==='menu') return '';
  return `<button class="fab" id="fabBtn">+</button>`;
}
function attachTabEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; render(); };
  });
  const fab = document.getElementById('fabBtn');
  if(fab) fab.onclick = ()=>{
    if(tab==='budget' && budgetView==='ahorro') openSavingSheet();
    else openSheetFor(tab);
  };
}

/* ============ tab content router ============ */
function tabContent(){
  if(tab==='home') return homeTab();
  if(tab==='goals') return goalsTab();
  if(tab==='plans') return plansTab();
  if(tab==='pet') return petTab();
  if(tab==='budget') return budgetTab();
  if(tab==='shopping') return shoppingTab();
  if(tab==='dates') return datesTab();
  return '';
}

/* ============ HOME ============ */
function monthKey(d){ const dt=new Date(d); return dt.getFullYear()+'-'+dt.getMonth(); }
function currentMonthTx(){
  const now = monthKey(new Date());
  return state.budget.transactions.filter(t=>monthKey(t.date)===now);
}
function homeTab(){
  const activeGoals = state.goals.filter(g=>!g.done);
  const matchedPlans = state.plans.filter(p=>!p.done && p.wantsA && p.wantsB);
  const tx = currentMonthTx();
  const spent = tx.filter(t=>t.type==='gasto').reduce((s,t)=>s+Number(t.amount),0);
  const limit = Number(state.budget.monthlyLimit)||0;
  const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
  const pending = state.shopping.filter(i=>!i.done).length;
  const upcoming = nextDate();

  return `
    <div class="section-title">Hola, ${ownerName(whoami)}</div>

function fmt(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('es-AR', {day:'numeric', month:'long'});
}
function nextDate(){
  if(!state.dates.length) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  let best = null;
  state.dates.forEach(d=>{
    let next = new Date(d.date);
    if(d.yearly){
      next.setFullYear(today.getFullYear());
      if(next < today) next.setFullYear(today.getFullYear()+1);
    }
    if(next >= today && (!best || next < best.next)) best = {title:d.title, next};
  });
  return best;
}

function timeAgo(iso){
  if(!iso) return null;
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'recién';
  if(mins < 60) return 'hace '+mins+' min';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return 'hace '+hrs+'h';
  const days = Math.round(hrs/24);
  return 'hace '+days+'d';
}

function toKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function eventsOnDay(d){
  const y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  return state.dates.filter(ev=>{
    const ed = new Date(ev.date);
    if(ev.yearly) return ed.getMonth()===m && ed.getDate()===day;
    return ed.getFullYear()===y && ed.getMonth()===m && ed.getDate()===day;
  });
}

  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y,m,1);
  const startOffset = (firstDay.getDay()+6)%7; // lunes=0
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y,m,day);
    const has = eventsOnDay(d).length>0;
    const isToday = d.getTime()===today.getTime();
    const isSel = d.getTime()===calSelected.getTime();
    cells += `
      <button data-cal-day="${day}" style="
        aspect-ratio:1;border-radius:10px;border:1px solid ${isSel?'var(--shared)':'transparent'};
        background:${isSel?'var(--shared-dim)':'transparent'};color:${isToday&&!isSel?'var(--shared)':'var(--text)'};
        font-family:'Inter',sans-serif;font-size:13px;font-weight:${isToday?600:500};
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;">
        <span>${day}</span>
        ${has ? `<span style="width:5px;height:5px;border-radius:50%;background:${isSel?'var(--shared)':'var(--shared)'};"></span>` : ''}
      </button>`;
  }

  const dayEvents = eventsOnDay(calSelected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  return `
    <div class="section-title">Calendario</div>
    <div class="card" style="margin-bottom:16px;">
      <div class="row between" style="margin-bottom:14px;">
        <button class="ghost" data-cal-nav="-1" style="padding:6px 10px;">‹</button>
        <span style="font-weight:600;text-transform:capitalize;">${MONTH_NAMES[m]} ${y}</span>
        <button class="ghost" data-cal-nav="1" style="padding:6px 10px;">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;">
        ${WEEKDAYS.map(w=>`<div style="text-align:center;font-size:11px;color:var(--text-dim);">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells}</div>
    </div>
    <div class="card">
      <div class="small muted" style="margin-bottom:8px;text-transform:capitalize;">${calSelected.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>
      ${dayEvents.length ? dayEvents.map(d=>`
        <div class="list-item">
          <div style="flex:1;">
            <div class="item-title">${escapeHtml(d.title)}</div>
            <div class="item-sub">${d.time ? d.time+' · ' : ''}${d.yearly ? 'se repite cada año' : ownerName(d.owner||'shared')}${d.notes ? ' · '+escapeHtml(d.notes) : ''}</div>
          </div>
          <button data-del-date="${d.id}" class="ghost" style="padding:6px 9px;">Quitar</button>
        </div>
      `).join('') : emptyState('Nada agendado', 'Tocá el + para sumar algo este día.')}
    </div>
  `;
}

/* ============ modals / sheets ============ */
function openSheet(html, onOpen){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  if(onOpen) onOpen();
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});

function openSheetFor(which){
  if(which==='goals') return openGoalSheet();
  if(which==='plans') return openPlanSheet();
  if(which==='budget') return openTxSheet();
  if(which==='shopping') return openShopSheet();
  if(which==='dates') return openDateSheet();
}

function openGoalSheet(){

      <label class="field">Título<input id="gTitle" placeholder="Ej: Ahorrar para el viaje" /></label>
      <label class="field">Notas (opcional)<input id="gNotes" placeholder="Detalles" /></label>
      <label class="field">Fecha meta (opcional)<input id="gDue" type="date" /></label>

        <div class="owner-choice" id="gOwner">
          <button data-val="A" class="sel-a">${state.settings.nameA}</button>
          <button data-val="B" class="sel-b">${state.settings.nameB}</button>
          <button data-val="shared" class="sel-shared">Juntos</button>
        </div>
      </label>
      <button class="primary" id="saveGoal">Guardar objetivo</button>
    </div>
  `, ()=>{
    let owner='shared';
    const buttons = document.querySelectorAll('#gOwner button');
    const markSel = ()=>buttons.forEach(b=>b.style.opacity = b.dataset.val===owner?1:.55);
    markSel();
    buttons.forEach(b=>b.onclick=()=>{ owner=b.dataset.val; markSel(); });
    document.getElementById('saveGoal').onclick = async ()=>{
      const title = document.getElementById('gTitle').value.trim();
      if(!title){ showToast('Poné un título'); return; }
      state.goals.push({
        id:uid(), title,
        notes:document.getElementById('gNotes').value.trim(),
        due:document.getElementById('gDue').value || null,
        owner, done:false

      await sset('goals', state.goals);
      closeSheet(); render();

function openTxSheet(){

  `, ()=>{

    const markSel=()=>buttons.forEach(b=>{

      state.budget.transactions.push({

      });

      closeSheet(); render();
    };

      state.budget.monthlyLimit = Number(document.getElementById('txLimit').value)||0;

      closeSheet(); render();

function openMenuSheet(dateKey, meal){
  const existing = menuEntryFor(dateKey, meal);
  const d = new Date(dateKey);
  const mealLabel = MEALS.find(m=>m.key===meal).label;
  openSheet(`
    <h3>${mealLabel} · ${WEEKDAY_LONG[d.getDay()]} ${d.getDate()}</h3>
    <div class="stack">
      <label class="field">¿Qué van a comer?<input id="mnDish" placeholder="Ej: Milanesas con puré" value="${existing?escapeHtml(existing.dish):''}" /></label>
      <label class="field">¿Quién cocina?
        <div class="owner-choice" id="mnCook">
          <button data-val="A" class="sel-a">${state.settings.nameA}</button>
          <button data-val="B" class="sel-b">${state.settings.nameB}</button>
          <button data-val="shared" class="sel-shared">Los dos</button>
        </div>
      </label>
      <button class="primary" id="saveMenu">Guardar</button>
      ${existing ? `<button class="ghost" id="deleteMenu" style="width:100%;">Quitar esta comida</button>` : ''}
    </div>
  `, ()=>{
    let cook = existing ? existing.cook : whoami;
    const buttons = document.querySelectorAll('#mnCook button');
    const markSel=()=>buttons.forEach(b=>b.style.opacity = b.dataset.val===cook?1:.55);
    markSel();
    buttons.forEach(b=>b.onclick=()=>{ cook=b.dataset.val; markSel(); });

    document.getElementById('saveMenu').onclick = async ()=>{
      const dish = document.getElementById('mnDish').value.trim();
      if(!dish){ showToast('Escribí qué van a comer'); return; }
      state.menu.entries = state.menu.entries.filter(e=>!(e.date===dateKey && e.meal===meal));
      state.menu.entries.push({id:uid(), date:dateKey, meal, dish, cook});
      await sset('menu', state.menu);
      closeSheet(); render();
    };
    const delBtn = document.getElementById('deleteMenu');
    if(delBtn) delBtn.onclick = async ()=>{
      state.menu.entries = state.menu.entries.filter(e=>!(e.date===dateKey && e.meal===meal));
      await sset('menu', state.menu);
      closeSheet(); render();
    };
  });
}

/* ============ delegated events for lists ============ */
document.addEventListener('click', async (e)=>{
  const gId = e.target.closest('[data-toggle-goal]')?.dataset.toggleGoal;
  if(gId){
    const g = state.goals.find(x=>x.id===gId);
    g.done = !g.done;
    await sset('goals', state.goals); render(); return;
  }
  const pId = e.target.closest('[data-toggle-plan]')?.dataset.togglePlan;
  if(pId){
    const p = state.plans.find(x=>x.id===pId);
    p.done = !p.done;
    await sset('plans', state.plans); render(); return;
  }
  const wantId = e.target.closest('[data-want-plan]')?.dataset.wantPlan;
  if(wantId){
    const p = state.plans.find(x=>x.id===wantId);
    if(whoami==='A') p.wantsA = !p.wantsA; else p.wantsB = !p.wantsB;
    await sset('plans', state.plans); render(); return;
  }
  const sId = e.target.closest('[data-toggle-shop]')?.dataset.toggleShop;
  if(sId){
    const i = state.shopping.find(x=>x.id===sId);
    i.done = !i.done;
    await sset('shopping', state.shopping); render(); return;
  }
  const delShop = e.target.closest('[data-del-shop]')?.dataset.delShop;
  if(delShop){
    state.shopping = state.shopping.filter(x=>x.id!==delShop);
    await sset('shopping', state.shopping); render(); return;
  }
  const delDate = e.target.closest('[data-del-date]')?.dataset.delDate;
  if(delDate){
    state.dates = state.dates.filter(x=>x.id!==delDate);
    await sset('dates', state.dates); render(); return;
  }
  const navBtn = e.target.closest('[data-cal-nav]');
  if(navBtn){
    calMonth.setMonth(calMonth.getMonth() + Number(navBtn.dataset.calNav));
    render(); return;
  }
  const dayBtn = e.target.closest('[data-cal-day]');
  if(dayBtn){
    calSelected = new Date(calMonth.getFullYear(), calMonth.getMonth(), Number(dayBtn.dataset.calDay));
    render(); return;
  }
  const clearDone = e.target.closest('#clearDoneBtn');
  if(clearDone){
    state.shopping = state.shopping.filter(x=>!x.done);
    await sset('shopping', state.shopping); render(); return;
  }
  const filterBtn = e.target.closest('[data-goal-filter]');
  if(filterBtn){ goalFilter = filterBtn.dataset.goalFilter; render(); return; }
  const editLimit = e.target.closest('#editLimitBtn');
  if(editLimit){ openEditLimit(); return; }
  const budgetViewBtn = e.target.closest('[data-budget-view]');
  if(budgetViewBtn){ budgetView = budgetViewBtn.dataset.budgetView; render(); return; }
  const editGoal = e.target.closest('#editGoalBtn');
  if(editGoal){ openGoalSheet_savings(); return; }
  const delSaving = e.target.closest('[data-del-saving]')?.dataset.delSaving;
  if(delSaving){
    state.savings.contributions = state.savings.contributions.filter(x=>x.id!==delSaving);
    await sset('savings', state.savings); render(); return;
  }
  const petQuick = e.target.closest('[data-pet-quick]')?.dataset.petQuick;
  if(petQuick){ await quickLog(petQuick); return; }
  const delPetLog = e.target.closest('[data-del-pet-log]')?.dataset.delPetLog;
  if(delPetLog){
    state.pet.logs = state.pet.logs.filter(x=>x.id!==delPetLog);
    await sset('pet', state.pet); render(); return;
  }
  const shoppingViewBtn = e.target.closest('[data-shopping-view]');
  if(shoppingViewBtn){ shoppingView = shoppingViewBtn.dataset.shoppingView; render(); return; }
  const menuSlot = e.target.closest('[data-menu-slot]')?.dataset.menuSlot;
  if(menuSlot){
    const [dateKey, meal] = menuSlot.split('|');
    openMenuSheet(dateKey, meal);
    return;
  }
});

/* ============ sync en tiempo real (Firestore) ============ */
function startRealtimeSync(){
  docRef().onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : {};
    const nextSnap = JSON.stringify(data);
    if(nextSnap === lastSnapshot) return;
    lastSnapshot = nextSnap;
    state.settings = data.settings || state.settings;
    state.goals = data.goals || [];
    state.plans = data.plans || [];
    state.budget = data.budget || {monthlyLimit:0, transactions:[]};
    state.savings = data.savings || {goal:0, contributions:[]};
    state.shopping = data.shopping || [];
    state.dates = data.dates || [];
    state.pet = data.pet || {name:'Prisca', logs:[]};
    state.menu = data.menu || {entries:[]};
    render();
  }, err=>{
    console.error('sync error', err);
    showToast('Se cortó la sincronización. Revisá tu conexión.');
  });
}

  return `

    <p>Todavía no conectaste esta copia a tu Firebase. Abrí el archivo <code>index.html</code>, buscá "PASO 1" cerca del final del script, y pegá ahí la configuración de tu propio proyecto de Firebase. Después volvé a subir el archivo.</p>
  </div>`;
}

/* ============ boot ============ */
(async function init(){
  if(!fbReady){ document.getElementById('root').innerHTML = configScreen(); return; }
  try{ whoami = localStorage.getItem(WHOAMI_KEY) || null; }catch(e){ whoami = null; }
  await loadAll();
  lastSnapshot = JSON.stringify({settings:state.settings, goals:state.goals, plans:state.plans, budget:state.budget, savings:state.savings, shopping:state.shopping, dates:state.dates, pet:state.pet, menu:state.menu});
  render();
  startRealtimeSync();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
