<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12201C">
<title>Nosotros</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nosotros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#12201C;
    --surface:#1B2E28;
    --surface-2:#223830;
    --line:#2D453C;
    --text:#F2F0E8;
    --text-dim:#9FB3A9;
    --a:#E8A33D;     /* persona A */
    --a-dim:#3A3122;
    --b:#D98C9A;     /* persona B */
    --b-dim:#3A2A2D;
    --shared:#6FB79A; /* compartido */
    --shared-dim:#213A30;
    --danger:#E2685A;
    --danger-dim:#3A2420;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',sans-serif;}
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:78px;
  }
  /* ---------- header ---------- */
  header{
    padding:20px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  header .brand{font-size:20px;font-weight:600;letter-spacing:-0.02em;}
  header .brand span{color:var(--shared);}
  .who-pill{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .who-pill button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .who-pill button.active-a{background:var(--a-dim);color:var(--a);}
  .who-pill button.active-b{background:var(--b-dim);color:var(--b);}

  main{flex:1;padding:0 20px 20px;}
  .section-title{font-size:18px;font-weight:600;margin:4px 0 14px;letter-spacing:-0.01em;}
  .muted{color:var(--text-dim);}
  .small{font-size:13px;}

  /* ---------- cards / rows ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}

  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .metric{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .metric .label{font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .metric .value{font-size:22px;font-weight:600;}

  .bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--shared);}
  .bar-fill.over{background:var(--danger);}

  .list-item{
    border-bottom:1px solid var(--line);
    padding:12px 0;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .list-item:last-child{border-bottom:none;}
  .tag{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .tag.a{background:var(--a-dim);color:var(--a);}
  .tag.b{background:var(--b-dim);color:var(--b);}
  .tag.shared{background:var(--shared-dim);color:var(--shared);}

  .checkbox{
    width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
    background:var(--surface-2);
  }
  .checkbox.checked{background:var(--shared);border-color:var(--shared);}
  .checkbox svg{width:14px;height:14px;display:none;}
  .checkbox.checked svg{display:block;}

  .item-title{font-size:15px;font-weight:500;}
  .item-title.done{text-decoration:line-through;color:var(--text-dim);}
  .item-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

  .empty{
    text-align:center;
    padding:36px 12px;
    color:var(--text-dim);
  }
  .empty .big{font-size:15px;color:var(--text);margin-bottom:4px;font-weight:500;}

  /* ---------- inputs ---------- */
  input,select,textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
  }
  input::placeholder,textarea::placeholder{color:var(--text-dim);}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-dim);}
  .owner-choice{display:flex;gap:8px;}
  .owner-choice button{
    flex:1;
    padding:10px 6px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .owner-choice button.sel-a{background:var(--a-dim);color:var(--a);border-color:var(--a);}
  .owner-choice button.sel-b{background:var(--b-dim);color:var(--b);border-color:var(--b);}
  .owner-choice button.sel-shared{background:var(--shared-dim);color:var(--shared);border-color:var(--shared);}

  button.primary{
    width:100%;
    background:var(--shared);
    color:#0E241C;
    border:none;
    border-radius:10px;
    padding:13px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
  }
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:10px;
    padding:10px 14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .fab{
    position:fixed;
    bottom:92px;
    right:calc(50% - 240px + 20px);
    width:56px;height:56px;
    border-radius:50%;
    background:var(--shared);
    color:#0E241C;
    border:none;
    font-size:26px;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:520px){
    .fab{right:20px;}
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg);
    border:1px solid var(--line);
    border-top-left-radius:20px;border-top-right-radius:20px;
    width:100%;max-width:480px;
    padding:22px 20px 28px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 16px;font-size:17px;}
  .sheet .stack{gap:14px;}

  /* ---------- bottom nav ---------- */
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    max-width:480px;
    margin:0 auto;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:40;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    padding:6px 2px;
    cursor:pointer;
  }
  nav.tabbar button.active{color:var(--shared);}
  nav.tabbar svg{width:21px;height:21px;}

  .setup-wrap{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:32px 26px;max-width:480px;margin:0 auto;
  }
  .setup-wrap h1{font-size:26px;line-height:1.25;margin:0 0 8px;}
  .setup-wrap p{color:var(--text-dim);margin:0 0 28px;font-size:14.5px;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="root"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ FIREBASE CONFIG ============ */
/* PASO 1: Reemplazá este objeto por el que te da tu propio proyecto de Firebase.
   Sacalo de: Configuración del proyecto > Tus apps > SDK setup and configuration.
   Es información pública (no una contraseña), no pasa nada si queda visible. */
const firebaseConfig = {
  apiKey: "AIzaSyAwS4IeE1FTz2FeiWwSlTxE6I4iRnYoEQE",
  authDomain: "nostros-app.firebaseapp.com",
  projectId: "nostros-app",
  storageBucket: "nostros-app.firebasestorage.app",
  messagingSenderId: "273424691354",
  appId: "1:273424691354:web:56e1ccdc2e2011057d6f23"
};
/* PASO 2 (opcional pero recomendado): cambiá esto por una palabra secreta que
   solo ustedes dos conozcan. Actúa como el "nombre de la sala" de sus datos,
   para que nadie más que tenga el mismo Firebase la pise. */
const ROOM_ID = "nuestra-sala";

let db = null;
let fbReady = false;
try{
  if(firebaseConfig.apiKey !== "PEGA_ACA_TU_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    fbReady = true;
  }
}catch(e){ console.error('firebase init error', e); }

function docRef(){ return db.collection('nosotros-app').doc(ROOM_ID); }

/* ============ storage helpers (Firestore) ============ */
async function sget(key){
  try{
    const snap = await docRef().get();
    const data = snap.exists ? snap.data() : null;
    return data && data[key] !== undefined ? data[key] : null;
  }catch(e){ console.error('read error', e); return null; }
}
async function sset(key, val){
  try{ await docRef().set({[key]: val}, {merge:true}); }
  catch(e){ console.error('write error', e); showToast('No se pudo guardar. Revisá tu conexión.'); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ============ state ============ */
let state = {
  settings: null,          // {nameA, nameB}
  goals: [],
  budget: {monthlyLimit:0, transactions:[]},
  shopping: [],
  dates: []
};
let whoami = null;         // 'A' | 'B'
let tab = 'home';
let lastSnapshot = '';

async function loadAll(){
  const [settings, goals, budget, shopping, dates] = await Promise.all([
    sget('settings'), sget('goals'), sget('budget'), sget('shopping'), sget('dates')
  ]);
  state.settings = settings;
  state.goals = goals || [];
  state.budget = budget || {monthlyLimit:0, transactions:[]};
  state.shopping = shopping || [];
  state.dates = dates || [];
}

function ownerName(owner){
  if(owner==='A') return state.settings?.nameA || 'Persona A';
  if(owner==='B') return state.settings?.nameB || 'Persona B';
  return 'Los dos';
}
function ownerTagClass(owner){
  return owner==='A' ? 'a' : owner==='B' ? 'b' : 'shared';
}

/* ============ render root ============ */
function render(){
  const root = document.getElementById('root');
  if(!state.settings){ root.innerHTML = setupScreen(); attachSetupEvents(); return; }
  if(!whoami){ root.innerHTML = whoScreen(); attachWhoEvents(); return; }

  root.innerHTML = `
    <div class="app">
      ${headerHtml()}
      <main>${tabContent()}</main>
      ${tabbarHtml()}
      ${fabHtml()}
    </div>
  `;
  attachChromeEvents();
  attachTabEvents();
}

/* ============ setup screen ============ */
function setupScreen(){
  return `
  <div class="setup-wrap">
    <h1>Un espacio para los dos.</h1>
    <p>Objetivos, plata y compras, sincronizado entre tus celulares. Para empezar, ¿cómo se llaman?</p>
    <div class="stack">
      <label class="field">Tu nombre
        <input id="nameA" placeholder="Ej: Juli" />
      </label>
      <label class="field">El nombre de tu pareja
        <input id="nameB" placeholder="Ej: Fran" />
      </label>
      <button class="primary" id="startBtn" style="margin-top:8px;">Crear nuestro espacio</button>
    </div>
  </div>`;
}
function attachSetupEvents(){
  document.getElementById('startBtn').onclick = async ()=>{
    const a = document.getElementById('nameA').value.trim();
    const b = document.getElementById('nameB').value.trim();
    if(!a || !b){ showToast('Completá los dos nombres'); return; }
    state.settings = {nameA:a, nameB:b};
    await sset('settings', state.settings);
    render();
  };
}

/* ============ who am i screen ============ */
function whoScreen(){
  return `
  <div class="setup-wrap">
    <h1>Hola de nuevo.</h1>
    <p>¿Quién sos vos en este celular?</p>
    <div class="stack">
      <button class="owner-choice sel-a" id="pickA" style="padding:16px;font-size:15px;">${state.settings.nameA}</button>
      <button class="owner-choice sel-b" id="pickB" style="padding:16px;font-size:15px;">${state.settings.nameB}</button>
    </div>
  </div>`;
}
function attachWhoEvents(){
  document.getElementById('pickA').onclick = ()=>{ whoami='A'; render(); };
  document.getElementById('pickB').onclick = ()=>{ whoami='B'; render(); };
}

/* ============ header + tabbar + fab ============ */
function headerHtml(){
  return `
  <header>
    <div class="brand">${state.settings.nameA} <span>&</span> ${state.settings.nameB}</div>
    <div class="who-pill">
      <button data-who="A" class="${whoami==='A'?'active-a':''}">${state.settings.nameA}</button>
      <button data-who="B" class="${whoami==='B'?'active-b':''}">${state.settings.nameB}</button>
    </div>
  </header>`;
}
function attachChromeEvents(){
  document.querySelectorAll('[data-who]').forEach(b=>{
    b.onclick = ()=>{ whoami = b.dataset.who; render(); };
  });
}

const TABS = [
  {id:'home', label:'Inicio', icon:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>'},
  {id:'goals', label:'Objetivos', icon:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>'},
  {id:'budget', label:'Presupuesto', icon:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h.01"/>'},
  {id:'shopping', label:'Compras', icon:'<path d="M6 8h13l-1.5 9h-10z"/><path d="M6 8 5 4H3"/><circle cx="9.5" cy="20" r="1"/><circle cx="16.5" cy="20" r="1"/>'},
  {id:'dates', label:'Fechas', icon:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/>'}
];
function tabbarHtml(){
  return `<nav class="tabbar">
    ${TABS.map(t=>`
      <button data-tab="${t.id}" class="${tab===t.id?'active':''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
        ${t.label}
      </button>`).join('')}
  </nav>`;
}
function fabHtml(){
  if(tab==='home') return '';
  return `<button class="fab" id="fabBtn">+</button>`;
}
function attachTabEvents(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; render(); };
  });
  const fab = document.getElementById('fabBtn');
  if(fab) fab.onclick = ()=>openSheetFor(tab);
}

/* ============ tab content router ============ */
function tabContent(){
  if(tab==='home') return homeTab();
  if(tab==='goals') return goalsTab();
  if(tab==='budget') return budgetTab();
  if(tab==='shopping') return shoppingTab();
  if(tab==='dates') return datesTab();
  return '';
}

/* ============ HOME ============ */
function monthKey(d){ const dt=new Date(d); return dt.getFullYear()+'-'+dt.getMonth(); }
function currentMonthTx(){
  const now = monthKey(new Date());
  return state.budget.transactions.filter(t=>monthKey(t.date)===now);
}
function homeTab(){
  const activeGoals = state.goals.filter(g=>!g.done);
  const tx = currentMonthTx();
  const spent = tx.filter(t=>t.type==='gasto').reduce((s,t)=>s+Number(t.amount),0);
  const limit = Number(state.budget.monthlyLimit)||0;
  const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
  const pending = state.shopping.filter(i=>!i.done).length;
  const upcoming = nextDate();

  return `
    <div class="section-title">Hola, ${ownerName(whoami)}</div>
    <div class="metric-grid">
      <div class="metric">
        <div class="label">Objetivos activos</div>
        <div class="value">${activeGoals.length}</div>
      </div>
      <div class="metric">
        <div class="label">Compras pendientes</div>
        <div class="value">${pending}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="row between" style="margin-bottom:10px;">
        <span class="small muted">Gasto de este mes</span>
        <span class="small" style="font-weight:600;">${fmt(spent)} ${limit>0 ? '/ '+fmt(limit) : ''}</span>
      </div>
      ${limit>0 ? `<div class="bar-track"><div class="bar-fill ${pct>=100?'over':''}" style="width:${pct}%"></div></div>` : `<div class="small muted">Todavía no definiste un presupuesto mensual. Tocá "Presupuesto" para cargarlo.</div>`}
    </div>
    <div class="card">
      <div class="small muted" style="margin-bottom:8px;">Próxima fecha importante</div>
      ${upcoming ? `<div class="item-title">${upcoming.title}</div><div class="item-sub">${fmtDate(upcoming.next)}</div>` : `<div class="small muted">No cargaron fechas todavía.</div>`}
    </div>
  `;
}
function fmt(n){ return '$' + Number(n||0).toLocaleString('es-AR'); }
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('es-AR', {day:'numeric', month:'long'});
}
function nextDate(){
  if(!state.dates.length) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  let best = null;
  state.dates.forEach(d=>{
    let next = new Date(d.date);
    if(d.yearly){
      next.setFullYear(today.getFullYear());
      if(next < today) next.setFullYear(today.getFullYear()+1);
    }
    if(next >= today && (!best || next < best.next)) best = {title:d.title, next};
  });
  return best;
}

/* ============ GOALS ============ */
let goalFilter = 'all';
function goalsTab(){
  let list = state.goals.slice().sort((a,b)=>Number(a.done)-Number(b.done));
  if(goalFilter==='mine') list = list.filter(g=>g.owner===whoami);
  if(goalFilter==='partner') list = list.filter(g=>g.owner===(whoami==='A'?'B':'A'));
  if(goalFilter==='shared') list = list.filter(g=>g.owner==='shared');

  return `
    <div class="section-title">Objetivos</div>
    <div class="row" style="gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      ${filterChip('all','Todos')}
      ${filterChip('mine','Míos')}
      ${filterChip('partner','De '+ownerName(whoami==='A'?'B':'A'))}
      ${filterChip('shared','Compartidos')}
    </div>
    <div class="card">
      ${list.length ? list.map(g=>`
        <div class="list-item">
          <div class="checkbox ${g.done?'checked':''}" data-toggle-goal="${g.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0E241C" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
          </div>
          <div style="flex:1;">
            <div class="item-title ${g.done?'done':''}">${escapeHtml(g.title)}</div>
            ${g.notes ? `<div class="item-sub">${escapeHtml(g.notes)}</div>` : ''}
            ${g.due ? `<div class="item-sub">Meta: ${fmtDate(g.due)}</div>` : ''}
          </div>
          <span class="tag ${ownerTagClass(g.owner)}">${g.owner==='shared'?'Juntos':ownerName(g.owner)}</span>
        </div>
      `).join('') : emptyState('Sin objetivos por acá', 'Tocá el + para sumar el primero.')}
    </div>
  `;
}
function filterChip(id,label){
  const active = goalFilter===id;
  return `<button class="ghost" data-goal-filter="${id}" style="${active?'background:var(--shared-dim);color:var(--shared);border-color:var(--shared);':''}">${label}</button>`;
}
function emptyState(big, small){
  return `<div class="empty"><div class="big">${big}</div><div class="small">${small}</div></div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

/* ============ BUDGET ============ */
function budgetTab(){
  const tx = currentMonthTx().slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const spent = tx.filter(t=>t.type==='gasto').reduce((s,t)=>s+Number(t.amount),0);
  const income = tx.filter(t=>t.type==='ingreso').reduce((s,t)=>s+Number(t.amount),0);
  const limit = Number(state.budget.monthlyLimit)||0;
  const pct = limit>0 ? Math.min(100, Math.round(spent/limit*100)) : 0;

  const byCat = {};
  tx.filter(t=>t.type==='gasto').forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+Number(t.amount); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = catEntries.length ? catEntries[0][1] : 1;

  return `
    <div class="section-title">Presupuesto del mes</div>
    <div class="card" style="margin-bottom:16px;">
      <div class="row between">
        <span class="small muted">Límite mensual</span>
        <button class="ghost" id="editLimitBtn" style="padding:5px 10px;">Editar</button>
      </div>
      <div class="row between" style="margin:10px 0 8px;">
        <span style="font-size:22px;font-weight:600;">${fmt(spent)}</span>
        <span class="small muted">${limit>0 ? 'de '+fmt(limit) : 'sin límite'}</span>
      </div>
      ${limit>0 ? `<div class="bar-track"><div class="bar-fill ${pct>=100?'over':''}" style="width:${pct}%"></div></div>` : ''}
      <div class="row between" style="margin-top:10px;">
        <span class="small muted">Ingresos del mes</span>
        <span class="small" style="font-weight:600;color:var(--shared);">${fmt(income)}</span>
      </div>
    </div>

    ${catEntries.length ? `
    <div class="card" style="margin-bottom:16px;">
      <div class="small muted" style="margin-bottom:10px;">Gastos por categoría</div>
      <div class="stack">
        ${catEntries.map(([cat,amt])=>`
          <div>
            <div class="row between small" style="margin-bottom:4px;"><span>${escapeHtml(cat)}</span><span class="muted">${fmt(amt)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxCat*100)}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <div class="card">
      <div class="small muted" style="margin-bottom:8px;">Movimientos de este mes</div>
      ${tx.length ? tx.map(t=>`
        <div class="list-item">
          <div style="flex:1;">
            <div class="item-title">${escapeHtml(t.category)}${t.note ? ' · '+escapeHtml(t.note) : ''}</div>
            <div class="item-sub">${fmtDate(t.date)} · ${ownerName(t.owner)}</div>
          </div>
          <span style="font-weight:600;color:${t.type==='gasto'?'var(--danger)':'var(--shared)'};">${t.type==='gasto'?'-':'+'}${fmt(t.amount)}</span>
        </div>
      `).join('') : emptyState('Sin movimientos', 'Sumá tu primer gasto o ingreso con el +.')}
    </div>
  `;
}

/* ============ SHOPPING ============ */
function shoppingTab(){
  const pending = state.shopping.filter(i=>!i.done);
  const done = state.shopping.filter(i=>i.done);
  return `
    <div class="section-title">Lista de compras</div>
    <div class="card" style="margin-bottom:16px;">
      ${pending.length ? pending.map(i=>shoppingRow(i)).join('') : emptyState('Nada pendiente', 'Buen momento para respirar. Sumá algo con el +.')}
    </div>
    ${done.length ? `
      <div class="row between" style="margin-bottom:8px;">
        <span class="small muted">Ya compradas (${done.length})</span>
        <button class="ghost" id="clearDoneBtn" style="padding:5px 10px;">Vaciar</button>
      </div>
      <div class="card">${done.map(i=>shoppingRow(i)).join('')}</div>
    ` : ''}
  `;
}
function shoppingRow(i){
  return `
    <div class="list-item">
      <div class="checkbox ${i.done?'checked':''}" data-toggle-shop="${i.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0E241C" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
      </div>
      <div style="flex:1;">
        <div class="item-title ${i.done?'done':''}">${escapeHtml(i.name)}</div>
        <div class="item-sub">${i.qty ? i.qty+' · ' : ''}agregado por ${ownerName(i.addedBy)}</div>
      </div>
      <button data-del-shop="${i.id}" class="ghost" style="padding:6px 9px;">Quitar</button>
    </div>`;
}

/* ============ DATES ============ */
function datesTab(){
  const today = new Date(); today.setHours(0,0,0,0);
  const items = state.dates.map(d=>{
    let next = new Date(d.date);
    if(d.yearly){ next.setFullYear(today.getFullYear()); if(next<today) next.setFullYear(today.getFullYear()+1); }
    return {...d, next};
  }).sort((a,b)=>a.next-b.next);

  return `
    <div class="section-title">Fechas importantes</div>
    <div class="card">
      ${items.length ? items.map(d=>`
        <div class="list-item">
          <div style="flex:1;">
            <div class="item-title">${escapeHtml(d.title)}</div>
            <div class="item-sub">${fmtDate(d.next)}${d.yearly ? ' · se repite cada año' : ''}</div>
          </div>
          <button data-del-date="${d.id}" class="ghost" style="padding:6px 9px;">Quitar</button>
        </div>
      `).join('') : emptyState('Sin fechas cargadas', 'Cumpleaños, aniversarios, lo que quieran recordar.')}
    </div>
  `;
}

/* ============ modals / sheets ============ */
function openSheet(html, onOpen){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  if(onOpen) onOpen();
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});

function openSheetFor(which){
  if(which==='goals') return openGoalSheet();
  if(which==='budget') return openTxSheet();
  if(which==='shopping') return openShopSheet();
  if(which==='dates') return openDateSheet();
}

function openGoalSheet(){
  openSheet(`
    <h3>Nuevo objetivo</h3>
    <div class="stack">
      <label class="field">Título<input id="gTitle" placeholder="Ej: Ahorrar para el viaje" /></label>
      <label class="field">Notas (opcional)<input id="gNotes" placeholder="Detalles" /></label>
      <label class="field">Fecha meta (opcional)<input id="gDue" type="date" /></label>
      <label class="field">¿De quién es?
        <div class="owner-choice" id="gOwner">
          <button data-val="A" class="sel-a">${state.settings.nameA}</button>
          <button data-val="B" class="sel-b">${state.settings.nameB}</button>
          <button data-val="shared" class="sel-shared">Juntos</button>
        </div>
      </label>
      <button class="primary" id="saveGoal">Guardar objetivo</button>
    </div>
  `, ()=>{
    let owner='shared';
    const buttons = document.querySelectorAll('#gOwner button');
    const markSel = ()=>buttons.forEach(b=>b.style.opacity = b.dataset.val===owner?1:.55);
    markSel();
    buttons.forEach(b=>b.onclick=()=>{ owner=b.dataset.val; markSel(); });
    document.getElementById('saveGoal').onclick = async ()=>{
      const title = document.getElementById('gTitle').value.trim();
      if(!title){ showToast('Poné un título'); return; }
      state.goals.push({
        id:uid(), title,
        notes:document.getElementById('gNotes').value.trim(),
        due:document.getElementById('gDue').value || null,
        owner, done:false
      });
      await sset('goals', state.goals);
      closeSheet(); render();
    };
  });
}

function openTxSheet(){
  openSheet(`
    <h3>Nuevo movimiento</h3>
    <div class="stack">
      <div class="owner-choice" id="txType">
        <button data-val="gasto">Gasto</button>
        <button data-val="ingreso">Ingreso</button>
      </div>
      <label class="field">Monto<input id="txAmount" type="number" placeholder="0" inputmode="decimal" /></label>
      <label class="field">Categoría<input id="txCat" placeholder="Ej: Supermercado, Alquiler, Salidas" /></label>
      <label class="field">Nota (opcional)<input id="txNote" placeholder="Detalle" /></label>
      <label class="field">Fecha<input id="txDate" type="date" /></label>
      <button class="primary" id="saveTx">Guardar movimiento</button>
    </div>
    <div style="height:1px;background:var(--line);margin:20px 0;"></div>
    <label class="field">Límite mensual de gasto (compartido)
      <input id="txLimit" type="number" value="${state.budget.monthlyLimit||''}" placeholder="Ej: 500000" />
    </label>
    <button class="ghost" id="saveLimit" style="margin-top:10px;width:100%;">Guardar límite</button>
  `, ()=>{
    let type='gasto';
    const buttons = document.querySelectorAll('#txType button');
    const markSel=()=>buttons.forEach(b=>{
      b.classList.toggle('sel-a', b.dataset.val==='gasto' && type==='gasto');
      b.classList.toggle('sel-shared', b.dataset.val==='ingreso' && type==='ingreso');
    });
    markSel();
    buttons.forEach(b=>b.onclick=()=>{ type=b.dataset.val; markSel(); });
    document.getElementById('txDate').value = new Date().toISOString().slice(0,10);

    document.getElementById('saveTx').onclick = async ()=>{
      const amount = Number(document.getElementById('txAmount').value);
      const category = document.getElementById('txCat').value.trim();
      if(!amount || !category){ showToast('Completá monto y categoría'); return; }
      state.budget.transactions.push({
        id:uid(), type, amount, category,
        note:document.getElementById('txNote').value.trim(),
        date:document.getElementById('txDate').value || new Date().toISOString().slice(0,10),
        owner:whoami
      });
      await sset('budget', state.budget);
      closeSheet(); render();
    };
    document.getElementById('saveLimit').onclick = async ()=>{
      state.budget.monthlyLimit = Number(document.getElementById('txLimit').value)||0;
      await sset('budget', state.budget);
      closeSheet(); render();
    };
  });
}
function openEditLimit(){ openTxSheet(); }

function openShopSheet(){
  openSheet(`
    <h3>Agregar a la lista</h3>
    <div class="stack">
      <label class="field">Producto<input id="shName" placeholder="Ej: Leche" /></label>
      <label class="field">Cantidad (opcional)<input id="shQty" placeholder="Ej: 2 litros" /></label>
      <button class="primary" id="saveShop">Agregar</button>
    </div>
  `, ()=>{
    document.getElementById('saveShop').onclick = async ()=>{
      const name = document.getElementById('shName').value.trim();
      if(!name){ showToast('Escribí el producto'); return; }
      state.shopping.push({id:uid(), name, qty:document.getElementById('shQty').value.trim(), done:false, addedBy:whoami});
      await sset('shopping', state.shopping);
      closeSheet(); render();
    };
  });
}

function openDateSheet(){
  openSheet(`
    <h3>Nueva fecha importante</h3>
    <div class="stack">
      <label class="field">¿Qué es?<input id="dTitle" placeholder="Ej: Aniversario" /></label>
      <label class="field">Fecha<input id="dDate" type="date" /></label>
      <label class="field row" style="flex-direction:row;align-items:center;gap:8px;">
        <input type="checkbox" id="dYearly" style="width:auto;" checked /> Se repite cada año
      </label>
      <button class="primary" id="saveDate">Guardar</button>
    </div>
  `, ()=>{
    document.getElementById('saveDate').onclick = async ()=>{
      const title = document.getElementById('dTitle').value.trim();
      const date = document.getElementById('dDate').value;
      if(!title || !date){ showToast('Completá nombre y fecha'); return; }
      state.dates.push({id:uid(), title, date, yearly:document.getElementById('dYearly').checked});
      await sset('dates', state.dates);
      closeSheet(); render();
    };
  });
}

/* ============ delegated events for lists ============ */
document.addEventListener('click', async (e)=>{
  const gId = e.target.closest('[data-toggle-goal]')?.dataset.toggleGoal;
  if(gId){
    const g = state.goals.find(x=>x.id===gId);
    g.done = !g.done;
    await sset('goals', state.goals); render(); return;
  }
  const sId = e.target.closest('[data-toggle-shop]')?.dataset.toggleShop;
  if(sId){
    const i = state.shopping.find(x=>x.id===sId);
    i.done = !i.done;
    await sset('shopping', state.shopping); render(); return;
  }
  const delShop = e.target.closest('[data-del-shop]')?.dataset.delShop;
  if(delShop){
    state.shopping = state.shopping.filter(x=>x.id!==delShop);
    await sset('shopping', state.shopping); render(); return;
  }
  const delDate = e.target.closest('[data-del-date]')?.dataset.delDate;
  if(delDate){
    state.dates = state.dates.filter(x=>x.id!==delDate);
    await sset('dates', state.dates); render(); return;
  }
  const clearDone = e.target.closest('#clearDoneBtn');
  if(clearDone){
    state.shopping = state.shopping.filter(x=>!x.done);
    await sset('shopping', state.shopping); render(); return;
  }
  const filterBtn = e.target.closest('[data-goal-filter]');
  if(filterBtn){ goalFilter = filterBtn.dataset.goalFilter; render(); return; }
  const editLimit = e.target.closest('#editLimitBtn');
  if(editLimit){ openEditLimit(); return; }
});

/* ============ sync en tiempo real (Firestore) ============ */
function startRealtimeSync(){
  docRef().onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : {};
    const nextSnap = JSON.stringify(data);
    if(nextSnap === lastSnapshot) return;
    lastSnapshot = nextSnap;
    state.settings = data.settings || state.settings;
    state.goals = data.goals || [];
    state.budget = data.budget || {monthlyLimit:0, transactions:[]};
    state.shopping = data.shopping || [];
    state.dates = data.dates || [];
    render();
  }, err=>{
    console.error('sync error', err);
    showToast('Se cortó la sincronización. Revisá tu conexión.');
  });
}

/* ============ pantalla de configuración pendiente ============ */
function configScreen(){
  return `
  <div class="setup-wrap">
    <h1>Falta un paso.</h1>
    <p>Todavía no conectaste esta copia a tu Firebase. Abrí el archivo <code>index.html</code>, buscá "PASO 1" cerca del final del script, y pegá ahí la configuración de tu propio proyecto de Firebase. Después volvé a subir el archivo.</p>
  </div>`;
}

/* ============ boot ============ */
(async function init(){
  if(!fbReady){ document.getElementById('root').innerHTML = configScreen(); return; }
  await loadAll();
  lastSnapshot = JSON.stringify({settings:state.settings, goals:state.goals, budget:state.budget, shopping:state.shopping, dates:state.dates});
  render();
  startRealtimeSync();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
